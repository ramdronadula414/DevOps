<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Login Page</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #001f3f, #00ff99); /* deep blue to neon green */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background: rgba(0, 0, 0, 0.85);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0,255,153,0.6);
      width: 350px;
      animation: fadeIn 1.2s ease-in-out;
      color: #00ff99;
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #00e6e6; /* cyan-blue */
      text-shadow: 0 0 8px #00ff99;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: #00e6e6;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #00ff99;
      border-radius: 8px;
      background: #001f3f;
      color: #00ff99;
      transition: 0.3s;
    }

    .form-group input:focus {
      border-color: #00e6e6;
      box-shadow: 0 0 12px #00ff99;
      outline: none;
    }

    .password-policy {
      font-size: 12px;
      color: #00e6e6;
      margin-top: -10px;
      margin-bottom: 10px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #00ff99, #00e6e6);
      border: none;
      border-radius: 8px;
      color: #001f3f;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      text-shadow: 0 0 5px #000;
    }

    .btn:hover {
      background: linear-gradient(135deg, #00e6e6, #00ff99);
      box-shadow: 0 0 15px #00ff99;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Cyber Access</h2>
    <form>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="password">Create Password</label>
        <input type="password" id="password" name="password" 
               pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" 
               title="Must contain at least 8 characters, including uppercase, lowercase, and a number" required>
        <div class="password-policy">
          Password must be at least 8 characters, include uppercase, lowercase, and a number.
        </div>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm-password" required>
      </div>

      <button type="submit" class="btn">Login</button>
    </form>
  </div>
</body>
</html>
